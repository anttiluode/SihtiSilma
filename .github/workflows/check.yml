name: Validate Sihti Eye
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check eye.js
      - run: node tests/smoke.cjs
      - run: node tests/benchmark_v2.cjs dev
